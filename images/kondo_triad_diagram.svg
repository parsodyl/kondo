<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      .font-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 27px; font-weight: 600; fill: #0F0F0F; text-anchor: middle; }
      .subtitle { font-size: 19px; font-weight: 400; fill: #222222; text-anchor: middle; }
      .kondo-label-title { font-size: 25px; font-weight: 500; fill: #0F0F0F; }
      .kondo-label-sub { font-size: 19px; font-weight: 400; fill: #222222; }
      .arrow-label { font-size: 18px; font-weight: 400; fill: #111111; }
      .arrow-line { stroke: #111111; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 10 6 L 1 10.5 L 3 6 Z" fill="#111111" />
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#FAFAFA" />

  <g class="font-main">
    <!-- 1. UI LAYER -->
    <rect x="228" y="54" width="824" height="98" rx="30" fill="#EBF3FA" stroke="#C5D7EA" stroke-width="2.5" />
    <text x="640" y="96" class="title">UI Layer</text>
    <text x="640" y="126" class="subtitle">Widgets &amp; Plugins</text>

    <!-- 2. KONDO LAYER -->
    <rect x="228" y="220" width="824" height="302" rx="30" fill="#E6F4EA" stroke="#C2DEC9" stroke-width="2.5" />
    <text x="256" y="272" class="kondo-label-title">Kondo Layer</text>
    <text x="256" y="300" class="kondo-label-sub">(or "Kondo Triad")</text>

    <!-- Hako Node -->
    <rect x="515" y="242" width="250" height="78" rx="39" fill="#FFFFFF" stroke="#85B893" stroke-width="2.5" />
    <text x="640" y="276" class="title">Hako</text>
    <text x="640" y="302" class="subtitle">State &amp; Orchestration</text>

    <!-- Interactor Node -->
    <rect x="262" y="424" width="250" height="78" rx="39" fill="#FFFFFF" stroke="#85B893" stroke-width="2.5" />
    <text x="387" y="458" class="title">Interactor</text>
    <text x="387" y="484" class="subtitle">Business Logic</text>

    <!-- Reactor Node -->
    <rect x="768" y="424" width="250" height="78" rx="39" fill="#FFFFFF" stroke="#85B893" stroke-width="2.5" />
    <text x="893" y="458" class="title">Reactor</text>
    <text x="893" y="484" class="subtitle">Side Effects Handler</text>

    <!-- 3. DATA LAYER -->
    <rect x="228" y="586" width="824" height="98" rx="30" fill="#FDF3E1" stroke="#E0C28F" stroke-width="2.5" />
    <text x="640" y="628" class="title">Data Layer</text>
    <text x="640" y="658" class="subtitle">Services &amp; Repositories</text>

    <!-- 4. ARROWS AND FLOWS -->

    <!-- UI Layer to/from Hako -->
    <line x1="612" y1="154" x2="612" y2="216" class="arrow-line" marker-end="url(#arrow)" />
    <text x="596" y="192" class="arrow-label" text-anchor="end">User Events</text>

    <line x1="668" y1="218" x2="668" y2="156" class="arrow-line" marker-end="url(#arrow)" />
    <text x="684" y="192" class="arrow-label" text-anchor="start">State Updates</text>

    <!-- Hako to/from Interactor -->
    <line x1="516" y1="322" x2="412" y2="414" class="arrow-line" marker-end="url(#arrow)" />
    <text x="406" y="348" class="arrow-label" text-anchor="middle">Business</text>
    <text x="406" y="370" class="arrow-label" text-anchor="middle">Requests</text>

    <line x1="446" y1="416" x2="544" y2="330" class="arrow-line" marker-end="url(#arrow)" />
    <text x="556" y="390" class="arrow-label" text-anchor="middle">Processed Data</text>
    <text x="556" y="412" class="arrow-label" text-anchor="middle">/ Streams</text>

    <!-- Hako to/from Reactor -->
    <line x1="766" y1="322" x2="870" y2="414" class="arrow-line" marker-end="url(#arrow)" />
    <text x="888" y="348" class="arrow-label" text-anchor="middle">Effect</text>
    <text x="888" y="370" class="arrow-label" text-anchor="middle">Commands</text>

    <line x1="836" y1="416" x2="738" y2="330" class="arrow-line" marker-end="url(#arrow)" />
    <text x="730" y="390" class="arrow-label" text-anchor="middle">User Choices</text>
    <text x="730" y="412" class="arrow-label" text-anchor="middle">Results</text>

    <!-- Interactor to/from Data Layer -->
    <line x1="388" y1="510" x2="452" y2="576" class="arrow-line" marker-end="url(#arrow)" />
    <text x="372" y="556" class="arrow-label" text-anchor="end">Data Requests</text>

    <line x1="500" y1="578" x2="436" y2="512" class="arrow-line" marker-end="url(#arrow)" />
    <text x="492" y="556" class="arrow-label" text-anchor="start">Data Responses</text>

    <!-- Reactor to UI Layer -->
    <path d="M 1018 463 L 1068 463 Q 1096 463 1096 435 L 1096 131 Q 1096 103 1068 103 L 1056 103" class="arrow-line" marker-end="url(#arrow)" />
    <text x="1112" y="312" class="arrow-label" text-anchor="start">UI Side Effects</text>
    <text x="1112" y="335" class="arrow-label" text-anchor="start">/ Actions</text>
  </g>
</svg>